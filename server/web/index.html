<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LAMP-1 语音助手</title>
<style>
  :root {
    --bg: #14161a;
    --panel: #1c1f26;
    --line: #2a2f3a;
    --text: #e8eaed;
    --dim: #9aa3b2;
    --warm: #ffb45c;
    --ok: #6ee7a8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: radial-gradient(1200px 600px at 50% -10%, #2a2318 0%, var(--bg) 55%);
    color: var(--text);
    font: 15px/1.6 "Segoe UI", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 24px 16px;
  }
  .app { width: min(860px, 100%); display: flex; flex-direction: column; gap: 14px; }
  header { display: flex; align-items: baseline; gap: 12px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: .5px; }
  header .state { color: var(--dim); font-size: 13px; }
  header .state b { color: var(--ok); font-weight: 600; }
  #log {
    flex: 1;
    min-height: 55vh;
    max-height: 66vh;
    overflow-y: auto;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    scroll-behavior: smooth;
  }
  .msg { max-width: 82%; padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; word-break: break-word; }
  .me { align-self: flex-end; background: #2b3444; border-bottom-right-radius: 4px; }
  .bot { align-self: flex-start; background: #20242c; border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .bot .who { color: var(--warm); font-size: 12px; margin-bottom: 2px; }
  .heard { align-self: flex-start; color: var(--dim); font-size: 13px; font-style: italic; }
  .err { align-self: flex-start; color: #ff8f8f; font-size: 13px; }
  .bar { display: flex; gap: 10px; }
  input[type=text] {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    color: var(--text);
    padding: 13px 16px;
    font-size: 15px;
    outline: none;
  }
  input[type=text]:focus { border-color: #4a5568; }
  button {
    border: 1px solid var(--line);
    background: #262b35;
    color: var(--text);
    border-radius: 12px;
    padding: 0 18px;
    font-size: 15px;
    cursor: pointer;
  }
  button:hover { background: #2f3542; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  #mic { width: 52px; font-size: 20px; padding: 0; }
  #mic.on { background: #7a2b2b; border-color: #a33; animation: pulse 1s infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(200,60,60,.15); } }
  .hint { color: var(--dim); font-size: 12.5px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>LAMP-1</h1>
    <div class="state" id="state">连接中…</div>
  </header>

  <div id="log"></div>

  <div class="bar">
    <button id="mic" title="按住说话">🎤</button>
    <input id="text" type="text" placeholder="输入问题，回车发送（也可以按住左边麦克风说话）" autocomplete="off" />
    <button id="send">发送</button>
  </div>
  <div class="hint">服务端：Vosk 离线识别 → 本地 Ollama 模型。说话时请靠近麦克风，每次说完停顿一下。</div>
</div>

<script>
const log = document.getElementById('log');
const stateEl = document.getElementById('state');
const input = document.getElementById('text');
const sendBtn = document.getElementById('send');
const micBtn = document.getElementById('mic');

let ws = null;
let pending = null;      // 当前回答的 DOM 节点
let busy = false;
let micStream = null, audioCtx = null, processor = null, recording = false;

function add(cls, text) {
  const el = document.createElement('div');
  el.className = cls;
  el.textContent = text;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

function setBusy(v) {
  busy = v;
  sendBtn.disabled = v;
  input.disabled = v;
}

function connect() {
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = () => { stateEl.innerHTML = '<b>已连接</b> · 模型就绪后即可提问'; };
  ws.onclose = () => {
    stateEl.textContent = '连接断开，3 秒后重连…';
    setTimeout(connect, 3000);
  };
  ws.onerror = () => { stateEl.textContent = '连接出错'; };
  ws.onmessage = (ev) => {
    let m;
    try { m = JSON.parse(ev.data); } catch { return; }
    if (m.type === 'heard') {
      add('heard', m.text === '（没听清）' ? '（没听清）' : '你说：' + m.text);
      if (m.text === '（没听清）') setBusy(false);
    } else if (m.type === 'token') {
      if (!pending) {
        pending = add('bot', '');
        pending.innerHTML = '<div class="who">LAMP-1</div>';
        pending.appendChild(document.createTextNode(''));
      }
      pending.lastChild.textContent += m.text;
      log.scrollTop = log.scrollHeight;
    } else if (m.type === 'done') {
      pending = null;
      setBusy(false);
    } else if (m.type === 'error') {
      add('err', '错误：' + m.text);
      pending = null;
      setBusy(false);
    }
  };
}

function ask(text) {
  if (!ws || ws.readyState !== WebSocket.OPEN || !text.trim() || busy) return;
  add('me', text);
  setBusy(true);
  ws.send(JSON.stringify({ type: 'ask', text }));
}

sendBtn.onclick = () => { ask(input.value); input.value = ''; };
input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { ask(input.value); input.value = ''; } });

// ---- 麦克风：16 kHz 单声道 PCM，base64 分片上传 ----
function b64FromInt16(int16) {
  const bytes = new Uint8Array(int16.buffer);
  let bin = '';
  const CH = 0x8000;
  for (let i = 0; i < bytes.length; i += CH) {
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
  }
  return btoa(bin);
}

async function startMic() {
  if (recording || busy) return;
  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true } });
  } catch (e) {
    add('err', '拿不到麦克风：' + e.message);
    return;
  }
  audioCtx = new AudioContext({ sampleRate: 16000 });
  const src = audioCtx.createMediaStreamSource(micStream);
  processor = audioCtx.createScriptProcessor(1024, 1, 1);
  processor.onaudioprocess = (e) => {
    if (!recording || !ws || ws.readyState !== WebSocket.OPEN) return;
    const f = e.inputBuffer.getChannelData(0);
    const pcm = new Int16Array(f.length);
    for (let i = 0; i < f.length; i++) {
      const v = Math.max(-1, Math.min(1, f[i]));
      pcm[i] = v < 0 ? v * 0x8000 : v * 0x7fff;
    }
    ws.send(JSON.stringify({ type: 'audio', b64: b64FromInt16(pcm) }));
  };
  src.connect(processor);
  processor.connect(audioCtx.destination);
  recording = true;
  micBtn.classList.add('on');
  setBusy(true);
  ws.send(JSON.stringify({ type: 'audio_start' }));
}

function stopMic() {
  if (!recording) return;
  recording = false;
  micBtn.classList.remove('on');
  if (processor) { processor.disconnect(); processor.onaudioprocess = null; processor = null; }
  if (audioCtx) { audioCtx.close(); audioCtx = null; }
  if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'audio_end' }));
}

micBtn.addEventListener('mousedown', startMic);
micBtn.addEventListener('mouseup', stopMic);
micBtn.addEventListener('mouseleave', stopMic);
micBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startMic(); }, { passive: false });
micBtn.addEventListener('touchend', (e) => { e.preventDefault(); stopMic(); }, { passive: false });

connect();
</script>
</body>
</html>
