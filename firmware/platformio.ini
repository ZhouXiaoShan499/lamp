; PlatformIO project for the smart interaction desk lamp (MVP firmware)
; Target: ESP32-S3-WROOM-1-N4R2
;
; Build:  pio run -e lamp_s3
; Flash:  pio run -e lamp_s3 -t upload
; Serial: pio device monitor -b 115200

[env:lamp_s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; 4 MB flash: two OTA app slots + LittleFS data + NVS
board_build.filesystem = littlefs
board_build.partitions = default.csv

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DLAMP_USE_OLED=0
    -DLAMP_HAS_SERVOS=1
    -DLAMP_HAS_VOICE=0

lib_deps =
    crankyoldgit/IRremoteESP8266 @ ^2.8.6
    bblanchon/ArduinoJson @ ^7.0.0

; Uncomment when enabling the OLED UI (set -DLAMP_USE_OLED=1 as well):
;    adafruit/Adafruit SSD1306 @ ^2.5.7
;    adafruit/Adafruit GFX Library @ ^1.11.5